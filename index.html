<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>毛概刷题神器 Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    animation: {
                        'bounce-slow': 'bounce 2s infinite',
                        'pulse-slow': 'pulse 3s infinite',
                        'float': 'float 3s ease-in-out infinite',
                        'shake': 'shake 0.5s ease-in-out',
                        'confetti': 'confetti 1s ease-out forwards',
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        @keyframes confetti {
            0% { transform: scale(0) rotate(0deg); opacity: 1; }
            100% { transform: scale(1.5) rotate(180deg); opacity: 0; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes progressFill {
            from { width: 0%; }
        }
        .animate-slideUp { animation: slideUp 0.4s ease-out forwards; }
        .animate-slideIn { animation: slideIn 0.3s ease-out forwards; }
        .animate-scaleIn { animation: scaleIn 0.3s ease-out forwards; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
        
        body {
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        .glass { 
            background: rgba(255, 255, 255, 0.8); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
        }
        .dark .glass { 
            background: rgba(30, 41, 59, 0.8); 
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 50%, #EC4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.1);
        }
        .card-hover:active {
            transform: scale(0.98);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
            box-shadow: 0 4px 15px -3px rgba(59, 130, 246, 0.5);
        }
        .btn-primary:hover {
            box-shadow: 0 6px 20px -3px rgba(59, 130, 246, 0.6);
        }
        
        .progress-ring {
            transition: stroke-dashoffset 0.5s ease-out;
        }
        
        .option-btn {
            transition: all 0.2s ease;
        }
        .option-btn:not(:disabled):hover {
            transform: translateX(4px);
            border-color: #3B82F6;
        }
        
        .streak-fire {
            filter: drop-shadow(0 0 8px rgba(251, 146, 60, 0.6));
        }
        
        /* Toast notification */
        .toast {
            animation: slideUp 0.3s ease-out, slideUp 0.3s ease-in 2.7s reverse forwards;
        }
        
        /* Modal backdrop */
        .modal-backdrop {
            animation: fadeIn 0.2s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        /* Answer card grid */
        .answer-card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 8px;
        }
    </style>
</head>

    <script>
        // ========== 题库数据 ==========
        const CHAPTER_DATA = {
            "导论": [
                { id: '0-1', type: '单选', question: "( )给中国送来了马克思列宁主义，给苦苦探寻救亡图存出路的中国人民指明了前进方向。", options: ["A. 鸦片战争", "B. 新文化运动", "C. 五四运动", "D. 十月革命"], answer: "D", explanation: "十月革命一声炮响，给中国送来了马克思列宁主义。" },
                { id: '0-2', type: '单选', question: "1938年，( )在党的六届六中全会上作了《论新阶段》的报告，强调:“没有抽象的马克思主义，只有具体的马克思主义……”", options: ["A. 毛泽东", "B. 任弼时", "C. 刘少奇", "D. 周恩来"], answer: "A", explanation: "1938年，毛泽东在党的六届六中全会上作了《论新阶段》的报告，标志着“马克思主义中国化”这一命题的正式提出。" },
                { id: '0-3', type: '单选', question: "党的十八大以来，以习近平同志为核心的党中央明确提出要不断推进( )。", options: ["A. 社会主义现代化", "B. 马克思主义中国化时代化", "C. “两个结合”", "D. 社会主义现代化强国"], answer: "B", explanation: "党的十八大以来，党中央明确提出要不断推进“马克思主义中国化时代化”。" },
                { id: '0-4', type: '单选', question: "( )明确把“不断谱写马克思主义中国化时代化新篇章”作为当代中国共产党人的庄严历史责任。", options: ["A. 党的十七大", "B. 党的十八大", "C. 党的十九大", "D. 党的二十大"], answer: "D", explanation: "党的二十大报告提出了这一庄严历史责任。" },
                { id: '0-5', type: '单选', question: "( )是马克思主义中国化时代化的第一次历史性飞跃。", options: ["A. 毛泽东思想", "B. 邓小平理论", "C. “三个代表”重要思想", "D. 科学发展观"], answer: "A", explanation: "毛泽东思想是马克思主义中国化的第一次历史性飞跃。" },
                { id: '0-6', type: '单选', question: "马克思主义中国化时代化的理论成果是一脉相承又( )的关系。", options: ["A. 实事求是", "B. 与时俱进", "C. 独立自主", "D. 精益求精"], answer: "B", explanation: "既一脉相承，又与时俱进。" },
                { id: '0-7', type: '单选', question: "马克思主义中国化时代化的最新理论成果是( )。", options: ["A. 毛泽东思想", "B. 科学发展观", "C. 习近平新时代中国特色社会主义思想", "D. 邓小平理论"], answer: "C", explanation: "习近平新时代中国特色社会主义思想是最新成果。" },
                { id: '0-8', type: '单选', question: "( )的召开，实现了新中国成立以来党的历史上具有深远意义的伟大转折。", options: ["A. 中共十一届三中全会", "B. 中共十二大", "C. 中共十三大", "D. 中共十一届六中全会"], answer: "A", explanation: "1978年召开的中共十一届三中全会是伟大转折。" },
                { id: '0-9', type: '单选', question: "中国特色社会主义理论体系不包括( )。", options: ["A. 邓小平理论", "B. 科学发展观", "C. 习近平新时代中国特色社会主义思想", "D. 毛泽东思想"], answer: "D", explanation: "毛泽东思想是第一大理论成果，不属于中特体系。" },
                { id: '0-10', type: '单选', question: "一百年来，中国共产党团结带领中国人民进行的一切奋斗、一切牺牲、一切创造，归结起来就是一个主题( )。", options: ["A. 实现共同富裕", "B. 实现全面建成小康社会", "C. 实现社会主义现代化", "D. 实现中华民族伟大复兴"], answer: "D", explanation: "归结起来就是一个主题：实现中华民族伟大复兴。" }
            ],
            "第一章: 毛泽东思想及其历史地位": [
                { id: '1-1', type: '单选', question: "毛泽东思想形成和发展的时代背景是:", options: ["A. 中国沦为半殖民地半封建社会", "B. 战争与革命成为时代主题", "C. 第一次世界大战的爆发", "D. 中国工人阶级的成长壮大"], answer: "B", explanation: "20世纪上半叶，帝国主义战争与无产阶级革命的时代主题，是毛泽东思想形成的时代背景。" },
                { id: '1-2', type: '单选', question: "1917年( )的胜利开辟了世界无产阶级社会主义革命的新时代，也给中国送来了马克思列宁主义....", options: ["A. 俄国十月革命", "B. 五四运动", "C. 中国共产党建立", "D. 中华人民共和国建立"], answer: "A", explanation: "十月革命一声炮响，给我们送来了马克思列宁主义。" },
                { id: '1-3', type: '单选', question: "毛泽东思想形成和发展的实践基础是:", options: ["A. 中国共产党领导人民进行革命和建设的成功实践", "B. 中国共产党领导的工人运动", "C. 中国共产党领导的农民运动", "D. 中国共产党领导的学生运动"], answer: "A", explanation: "中国共产党领导人民进行革命和建设的成功实践是毛泽东思想形成和发展的实践基础。" },
                { id: '1-4', type: '单选', question: "中国共产党提出新民主主义革命的基本思想是在:", options: ["A. 国民革命战争时期", "B. 土地革命战争时期", "C. 抗日战争时期", "D. 解放战争时期"], answer: "A", explanation: "在国民革命时期，毛泽东提出了《中国社会各阶级的分析》等著作，初步形成了新民主主义革命的基本思想。" },
                { id: '1-5', type: '单选', question: "以毛泽东为代表的中国共产党人初步开辟了农村包围城市、武装夺取政权革命道路是在:", options: ["A. 国民革命战争时期", "B. 土地革命战争时期", "C. 抗日战争时期", "D. 解放战争时期"], answer: "B", explanation: "土地革命战争时期，毛泽东带领队伍上井冈山，开辟了农村包围城市的道路。" },
                { id: '1-6', type: '单选', question: "毛泽东思想得到系统总结和多方面展开而趋于成熟是在:", options: ["A. 国民革命战争时期", "B. 土地革命战争时期", "C. 抗日战争时期", "D. 解放战争时期"], answer: "C", explanation: "抗日战争时期，毛泽东思想趋于成熟，并在中共七大上被确立为指导思想。" },
                { id: '1-7', type: '单选', question: "( )把毛泽东思想确立为党必须长期坚持的指导思想并写入党章。", options: ["A. 遵义会议", "B. 党的六届六中全会", "C. 党的七大", "D. 党的七届二中全会"], answer: "C", explanation: "1945年党的七大确立了毛泽东思想的指导地位。" },
                { id: '1-8', type: '单选', question: "中国的武装斗争是无产阶级领导下的以( )为主体的革命战争:", options: ["A. 工人", "B. 农民", "C. 城市小资产阶级", "D. 知识分子"], answer: "B", explanation: "中国革命实质上是农民革命，武装斗争是以农民为主体的革命战争。" },
                { id: '1-9', type: '单选', question: "( )指出:“全党已经空前一致地认识了毛泽东同志的路线的正确性，空前自觉地团结在毛泽东的旗帜下了。”", options: ["A. 《九月来信》", "B. 《关于若干历史问题的决议》", "C. 《中国共产党党章》", "D. 《论人民民主专政》"], answer: "B", explanation: "这是党的六届七中全会通过的《关于若干历史问题的决议》中的内容。" },
                { id: '1-10', type: '单选', question: "经济工作和其他一切工作的生命线是:", options: ["A. 思想政治工作", "B. 组织建设工作", "C. 作风建设工作", "D. 军队建设工作"], answer: "A", explanation: "毛泽东指出，掌握思想教育，是团结全党进行伟大政治斗争的中心环节。思想政治工作是经济工作和其他一切工作的生命线。" },
                { id: '1-11', type: '单选', question: "中国共产党历史上，第一次使用“毛泽东思想的活的灵魂”的表述是在:", options: ["A. 《反对本本主义》", "B. 《关于若干历史问题的决议》", "C. 《关于修改党章的报告》", "D. 《关于建国以来党的若干历史问题的决议》"], answer: "D", explanation: "1981年十一届六中全会通过的《关于建国以来党的若干历史问题的决议》首次使用了“毛泽东思想的活的灵魂”这一表述。" },
                { id: '1-12', type: '单选', question: "( )开始形成以毛泽东同志为核心的党的第一代中央领导集体。", options: ["A. 遵义会议", "B. 第一次政治协商会议", "C. 中共七大", "D. 新中国成立"], answer: "A", explanation: "遵义会议确立了毛泽东在党中央和红军的领导地位，开始确立以毛泽东为主要代表的马克思主义正确路线在党中央的领导地位。" },
                { id: '1-13', type: '单选', question: "毛泽东思想的精髓是:", options: ["A. 实事求是", "B. 群众路线", "C. 独立自主", "D. 艰苦奋斗"], answer: "A", explanation: "实事求是是毛泽东思想的精髓，是马克思主义的根本观点。" },
                { id: '1-14', type: '单选', question: "中国共产党的根本工作路线是:", options: ["A. 实事求是", "B. 群众路线", "C. 独立自主", "D. 自力更生"], answer: "B", explanation: "群众路线是我们党的根本工作路线，是一切为了群众，一切依靠群众，从群众中来，到群众中去。" },
                { id: '1-15', type: '单选', question: "( )，创造性地将支部建在连上，成立各级士兵委员会，实行民主制度，在政治上官兵平等。", options: ["A. 南昌起义", "B. 秋收起义", "C. 三湾改编", "D. 古田会议"], answer: "C", explanation: "三湾改编确立了“支部建在连上”的原则。" },
                { id: '1-16', type: '单选', question: "“人民，只有人民，才是创造世界历史的动力。”这句话表达毛泽东思想活的灵魂是:", options: ["A. 统一战线", "B. 实事求是", "C. 群众路线", "D. 独立自主"], answer: "C", explanation: "这体现了相信群众、依靠群众的群众路线。" },
                { id: '1-17', type: '单选', question: "毛泽东在《反对本本主义》一文中就指出:“中国革命斗争的胜利要靠中国同志了解中国情况。”这句话的意思是:", options: ["A. 加强学习马克思主义理论", "B. 保持与共产国际的联系", "C. 坚持独立自主原则", "D. 必须走群众路线"], answer: "C", explanation: "这句话强调了独立自主，反对教条主义和对外国经验的照搬。" },
                { id: '1-18', type: '单选', question: "马克思主义中国化时代化第一次历史性飞跃的理论成果是:", options: ["A. 毛泽东思想", "B. 邓小平理论", "C. 科学发展观", "D. 习近平新时代中国特色社会主义思想"], answer: "A", explanation: "毛泽东思想是马克思主义中国化的第一次历史性飞跃。" },
                { id: '1-19', type: '单选', question: "毛泽东说:我们已经找至新路，我们能跳出这周期率。这条新路，就是:", options: ["A. 革命", "B. 民主", "C. 统一战线", "D. 党的领导"], answer: "B", explanation: "这就是著名的“窑洞对”，毛泽东指出跳出历史周期率的新路是“民主”。" },
                { id: '1-20', type: '单选', question: "已经包含了毛泽东思想的活的灵魂的实事求是、群众路线、独立自主三个方面的基本因子的著作是:", options: ["A. 《星星之火，可以燎原》", "B. 《反对本本主义》", "C. 《矛盾论》、《实践论》", "D. 《新民主主义论》"], answer: "B", explanation: "《反对本本主义》是毛泽东思想活的灵魂的初步形成标志。" }
            ],
            "第二章: 新民主主义革命理论": [
                { id: '2-1', type: '单选', question: "解决中国革命问题的基本前提是:", options: ["A. 分清敌人和朋友", "B. 认清中国国情", "C. 坚持无产阶级领导权", "D. 建立工农联盟"], answer: "B", explanation: "认清国情是解决中国革命问题的基本前提。" },
                { id: '2-2', type: '单选', question: "近代中国革命以( )为开端，进入新民主主义革命阶段:", options: ["A. 戊戌变法", "B. 辛亥革命", "C. 五四运动", "D. 中国共产党的成立"], answer: "C", explanation: "五四运动是旧民主主义革命走向新民主主义革命的转折点。" },
                { id: '2-3', type: '单选', question: "中国革命的首要对象是:", options: ["A. 资产阶级", "B. 官僚资本主义", "C. 帝国主义", "D. 封建主义"], answer: "C", explanation: "近代中国的主要矛盾决定了帝国主义是中国革命的首要对象。" },
                { id: '2-4', type: '单选', question: "新民主主义革命最基本的动力是:", options: ["A. 无产阶级", "B. 农民阶级", "C. 贫农", "D. 工人和农民"], answer: "A", explanation: "无产阶级是中国革命最基本的动力和领导力量。" },
                { id: '2-5', type: '单选', question: "新民主主义革命的主力军是:", options: ["A. 工人阶级", "B. 农民阶级", "C. 民族资产阶级", "D. 小资产阶级"], answer: "B", explanation: "农民是中国革命的主力军，贫农是无产阶级最可靠的同盟军。" },
                { id: '2-6', type: '单选', question: "新民主主义革命的基本问题是:", options: ["A. 无产阶级领导权问题", "B. 农民问题", "C. 武装斗争问题", "D. 工农联盟问题"], answer: "B", explanation: "中国革命实质上是农民革命，农民问题是中国革命的基本问题。" },
                { id: '2-7', type: '单选', question: "新民主主义革命的中心问题是:", options: ["A. 无产阶级的领导权", "B. 农民阶级的主力军地位", "C. 民族资产阶级的领导权", "D. 无产阶级同资产阶级的联盟"], answer: "A", explanation: "无产阶级的领导权是中国革命的中心问题，也是新旧民主主义革命区别的根本标志。" },
                { id: '2-8', type: '单选', question: "毛泽东所说的中国民族资产阶级“从娘肚子里带出来的老毛病”是指:", options: ["A. 软弱性", "B. 妥协性", "C. 动摇性", "D. 两面性"], answer: "A", explanation: "由于中国民族资本主义经济力量薄弱，民族资产阶级具有先天的软弱性。" },
                { id: '2-9', type: '单选', question: "中国民主主义革命经历了旧民主主义革命和新民主主义革命两个阶段，“旧”阶段转变到“新”阶段的根本标志是:", options: ["A. 中国革命领导阶级的变化", "B. 中国革命主要对象的变化", "C. 中国革命基本性质的变化", "D. 中国社会主要矛盾的变化"], answer: "A", explanation: "领导阶级由资产阶级转变为无产阶级，是新旧民主主义革命转变的根本标志。" },
                { id: '2-10', type: '单选', question: "新民主主义革命的性质是:", options: ["A. 无产阶级革命", "B. 农民阶级革命", "C. 新式的特殊的资产阶级民主主义革命", "D. 旧式资产阶级民主主义革命"], answer: "C", explanation: "新民主主义革命虽然由无产阶级领导，但其任务是反帝反封建，属于资产阶级民主革命范畴，但它是新式的、特殊的。" },
                { id: '2-11', type: '单选', question: "抗日战争时期，中国共产党在敌后抗日根据地实行的土地政策是:", options: ["A. 没收地主土地分配给农民", "B. 保持原有的土地状态", "C. 没收一切土地平均分配", "D. 减租减息"], answer: "D", explanation: "抗战时期为了团结地主阶级共同抗日，实行减租减息政策。" },
                { id: '2-12', type: '单选', question: "包含着新民主主义革命和社会主义革命双重性质的经济政策是:", options: ["A. 没收封建地主阶级的土地", "B. 保护民族工商业", "C. 没收官僚垄断资本", "D. 没收民族资本"], answer: "C", explanation: "没收官僚资本，一方面是反帝反封建（民主革命性质），另一方面是建立国营经济（社会主义革命性质）。" },
                { id: '2-13', type: '单选', question: "新民主主义经济纲领中极具特色的一项内容是:", options: ["A. 没收封建地主阶级的土地归农民所有", "B. 保护民族工商业", "C. 没收官僚垄断资本归新民主主义国家所有", "D. 没收民族资本归新民主主义国家所有"], answer: "B", explanation: "保护民族工商业是新民主主义经济纲领中极具特色的一项。" },
                { id: '2-14', type: '单选', question: "中国革命建立最广泛的统一战线不仅是必要的，而且是可能的，这种可能是由:", options: ["A. 中国半殖民地半封建社会的阶级状况决定的", "B. 半殖民地半封建的中国社会交织在一起的诸多矛盾决定的", "C. 中国革命的长期性、残酷性及其发展的不平衡性所决定的", "D. 战争与革命的时代主题决定的"], answer: "B", explanation: "错综复杂的矛盾使得我们可以利用矛盾，建立广泛的统一战线。" },
                { id: '2-15', type: '单选', question: "在同资产阶级的联盟中必须实行的方针是:", options: ["A. 既联合又斗争", "B. 一切经过统一战线", "C. 一切服从统一战线", "D. 团结一批评一团结"], answer: "A", explanation: "对资产阶级（特别是民族资产阶级）要采取既联合又斗争的策略。" },
                { id: '2-16', type: '单选', question: "无产阶级及其政党在统一战线中必须坚持的原则是:", options: ["A. 一切经过统一战线", "B. 一切服从统一战线", "C. 坚决斗争", "D. 独立自主"], answer: "D", explanation: "坚持独立自主是统一战线中的根本原则。" },
                { id: '2-17', type: '单选', question: "中国革命的特点和优点是:", options: ["A. 由中国共产党领导的人民战争", "B. 目标是争取民族独立、人民解放，最终实现国家繁荣富强", "C. 以反帝反封建作为两大革命任务", "D. 以武装的革命反对武装的反革命"], answer: "D", explanation: "斯大林曾指出，中国革命的优点是武装的革命反对武装的反革命。" },
                { id: '2-18', type: '单选', question: "人民军队的宗旨是:", options: ["A. 把政治工作放在一切工作的首位", "B. 坚持中国共产党对军队的绝对领导", "C. 全心全意为人民服务", "D. 坚持以马克思主义为指导"], answer: "C", explanation: "全心全意为人民服务是人民军队的唯一宗旨。" },
                { id: '2-19', type: '单选', question: "建设新型人民军队的根本原则是:", options: ["A. 全心全意为人民服务", "B. 坚持党对军队的绝对领导", "C. 广泛的思想政治工作", "D. 官兵平等"], answer: "B", explanation: "党指挥枪，坚持党对军队的绝对领导是根本原则。" },
                { id: '2-20', type: '单选', question: "1949年，毛泽东在( )一文中，对新民主主义革命的基本经验作了集中概括:", options: ["A. 《论人民民主专政》", "B. 《<共产党人>发刊词》", "C. 《中国革命和中国共产党》", "D. 《改造我们的学习》"], answer: "A", explanation: "在建国前夕的《论人民民主专政》中，毛泽东总结了三大法宝等经验。" }
            ],
            "第三章: 社会主义改造理论": [
                { id: '3-1', type: '单选', question: "中国共产党提出由新民主主义社会和平过渡到社会主义社会的最初设想是:", options: ["A. 民主革命时期", "B. 中华人民共和国成立后", "C. 社会主义改造完成后", "D. “文化大革命”时期"], answer: "A", explanation: "早在民主革命时期，党就提出了从新民主主义和平过渡到社会主义的设想。" },
                { id: '3-2', type: '单选', question: "1952年底，随着土地改革的基本完成，我国社会的主要矛盾已转变成:", options: ["A. 人民大众同帝国主义、封建主义及其走狗国民党反动派残余的矛盾", "B. 帝国主义和中华民族的矛盾、封建主义和人民大众的矛盾", "C. 工人阶级同资产阶级的矛盾、社会主义道路同资本主义道路的矛盾", "D. 人民日益增长的物质文化需要同落后的社会生产之间的矛盾"], answer: "C", explanation: "1952年土改完成后，无产阶级与资产阶级的矛盾上升为主要矛盾。" },
                { id: '3-3', type: '单选', question: "新民主主义社会中，处于领导地位的经济成分是:", options: ["A. 个体经济", "B. 私人和国家资本主义经济", "C. 国营经济", "D. 合作社经济"], answer: "C", explanation: "国营经济掌握经济命脉，处于领导地位。" },
                { id: '3-4', type: '单选', question: "建国初期，我国社会主义国营经济建立的最主要途径和手段是:", options: ["A. 没收帝国主义在华企业", "B. 没收官僚资本", "C. 没收民族资本", "D. 没收地主阶级的土地和财产"], answer: "B", explanation: "没收官僚资本是建立国营经济的主要途径。" },
                { id: '3-5', type: '单选', question: "个体经济向社会主义集体经济过渡的形式是:", options: ["A. 国营经济", "B. 私人资本主义经济", "C. 国家资本主义经济", "D. 合作社经济"], answer: "D", explanation: "合作社经济是引导个体经济过渡的形式。" },
                { id: '3-6', type: '单选', question: "毛泽东关于农业社会主义改造理论来源是:", options: ["A. 马克思的合作化理论", "B. 恩格斯的合作化理论", "C. 列宁的合作化理论", "D. 斯大林的合作化理论"], answer: "C", explanation: "列宁的合作化理论对毛泽东影响最深。" },
                { id: '3-7', type: '单选', question: "标志着资本主义工商业的社会主义改造已经基本完成是实现了:", options: ["A. 手工业合作社的建立", "B. 农业合作化", "C. 全行业公私合营", "D. 生产责任制"], answer: "C", explanation: "1956年全行业公私合营标志着资本主义工商业改造基本完成。" },
                { id: '3-8', type: '单选', question: "过渡时期总路线的主体是:", options: ["A. 国家的社会主义工业化", "B. 私营经济的国有化", "C. 个体农业的集体化", "D. 对个体农业、手工业和资本主义工商业的改造"], answer: "A", explanation: "“一化三改”，“一化”（工业化）是主体。" },
                { id: '3-9', type: '单选', question: "关于社会主义过渡时期总路线错误的说法是:", options: ["A. 实现社会主义工业化，农业、手工业和资本主义工商业的社会主义改造", "B. 过渡时期结束的标志是社会主义改造结束", "C. 以单一的社会主义公有制和计划经济体制为目标", "D. 以中国特色社会主义为目标"], answer: "D", explanation: "当时的目标是建立苏联模式的社会主义，尚未提出“中国特色社会主义”概念。" },
                { id: '3-10', type: '单选', question: "党在过渡时期总路线的实质是:", options: ["A. 改变生产资料的私有制", "B. 发展生产力", "C. 消灭剥削阶级", "D. 改造个体农民和手工业者"], answer: "A", explanation: "总路线的实质是使生产资料的社会主义所有制成为唯一的经济基础。" },
                { id: '3-11', type: '单选', question: "中国社会主义改造和社会主义建设道路中一个十分突出的特殊问题是:", options: ["A. 一个落后的农业国的工业化问题", "B. 农业的社会主义改造问题", "C. 农业的机械化问题", "D. 民族资本主义工商业的社会主义改造问题"], answer: "A", explanation: "在落后农业国实现工业化是中国面临的特殊难题。" },
                { id: '3-12', type: '单选', question: "制定我国第一个五年计划的依据是:", options: ["A. 国民经济的恢复和发展", "B. 土地改革的完成", "C. 实现国家工业化", "D. 过渡时期的总路线"], answer: "D", explanation: "过渡时期总路线是制定“一五”计划的依据。" },
                { id: '3-13', type: '单选', question: "中国共产党对个体农业和手工业实行社会主义改造的方针是:", options: ["A. 趁热打铁，积极领导", "B. 自愿互利，国家帮助", "C. 积极领导，稳步前进", "D. 国家帮助，典型示范"], answer: "C", explanation: "对农业和手工业的方针是“积极领导，稳步前进”。" },
                { id: '3-14', type: '单选', question: "我国在手工业的社会主义改造过程中所办的手工业生产合作社属于:", options: ["A. 社会主义性质", "B. 半社会主义性质", "C. 社会主义萌芽性质", "D. 非社会主义性质"], answer: "A", explanation: "生产合作社已经是社会主义性质的集体经济组织。" },
                { id: '3-15', type: '单选', question: "中国共产党对资本主义工商业进行社会主义改造的主要方式是:", options: ["A. 和平赎买", "B. 统购统销", "C. 公私合营", "D. 合作化"], answer: "A", explanation: "和平赎买是改造资本主义工商业的创举。" },
                { id: '3-16', type: '单选', question: "我国对资本主义工商业改造创造了国家资本主义的高级形式是:", options: ["A. 统购包销", "B. 委托加工，计划订货", "C. 经销、代销", "D. 公私合营"], answer: "D", explanation: "公私合营（特别是全行业公私合营）是高级形式。" },
                { id: '3-17', type: '单选', question: "在公私合营企业中，企业利润“四马分肥”，这时的企业性质:", options: ["A. 仍然属于私营企业", "B. 属于半社会主义性质", "C. 具有了社会主义因素", "D. 基本上属于社会主义国营性质"], answer: "B", explanation: "公私合营企业属于半社会主义性质。" },
                { id: '3-18', type: '单选', question: "在我国的过渡性质时期，民族资产阶级与工人阶级的矛盾性质是:", options: ["A. 对抗性的", "B. 非对抗性的", "C. 既有对抗性一面又有非对抗性的一面", "D. 没有矛盾"], answer: "C", explanation: "具有两面性，处理得当可以转化为非对抗性。" },
                { id: '3-19', type: '单选', question: "我国进入社会主义初级阶段的起点及剥削阶级和剥削制度被消灭的标志是:", options: ["A. 社会主义改造的完成", "B. 国民经济恢复任务的完成", "C. 中华人民共和国的成立", "D. 中共十三大的召开"], answer: "A", explanation: "1956年三大改造完成，标志着社会主义制度确立，进入初级阶段。" },
                { id: '3-20', type: '单选', question: "1956年，社会主义改造基本完成以后，我国社会的主要矛盾是:", options: ["A. 工人阶级和资产阶级的矛盾", "B. 社会主义道路和资本主义道路之间的矛盾", "C. 人民日益增长的物质文化生活需要同落后的社会生产之间的矛盾", "D. 坚持思想基本原则和资产阶级自由化之间的矛盾"], answer: "C", explanation: "党的八大指出了这一主要矛盾。" }
            ],
            "第四章: 社会主义建设道路初步探索": [
                { id: '4-1', type: '单选', question: "毛泽东明确提出以苏为鉴，独立自主地探索适合中国情况的社会主义建设道路的著作是:", options: ["A. 《论十大关系》", "B. 《新民主主义论》", "C. 《关于正确处理人民内部矛盾的问题》", "D. 《中国革命和中国共产党》"], answer: "A", explanation: "《论十大关系》标志着党探索中国社会主义建设道路的良好开端。" },
                { id: '4-2', type: '单选', question: "成为党探索中国社会主义建设道路良好开端的文章，是毛泽东发表的:", options: ["A. 《论人民民主专政》", "B. 《论十大关系》", "C. 《纪念孙中山先生》", "D. 《关于正确处理人民内部矛盾的问题》"], answer: "B", explanation: "同上，《论十大关系》是开端。" },
                { id: '4-3', type: '单选', question: "《论十大关系》的报告围绕的基本方针是:", options: ["A. 独立自主", "B. 自力更生为主，争取外援为辅", "C. 调动一切积极因素，为社会主义事业服务", "D. 走中国特色社会主义道路"], answer: "C", explanation: "《论十大关系》的基本方针是调动一切积极因素，为社会主义事业服务。" },
                { id: '4-4', type: '单选', question: "《论十大关系》的前三条实际上明确提出了:", options: ["A. 中国的工业化道路问题", "B. 中国的经济建设问题", "C. 中国的工业发展问题", "D. 工业发展的平衡问题"], answer: "A", explanation: "重工业、轻工业、农业的关系，涉及工业化道路问题。" },
                { id: '4-5', type: '单选', question: "不属于《论十大关系》讨论范畴的是:", options: ["A. 社会主义市场经济和计划经济的关系", "B. 重工业和轻工业、农业的关系", "C. 国家、生产单位和生产者个人的关系", "D. 革命和反革命的关系"], answer: "A", explanation: "当时尚未涉及“市场经济”概念，A选项不属于讨论范畴。" },
                { id: '4-6', type: '单选', question: "党的八大提出今后党和国家的工作重点是:", options: ["A. 调动一切积极因素，为社会主义事业服务", "B. 正确处理人民内部矛盾，巩固社会主义制度", "C. 集中力量发展生产力，建设社会主义现代化强国", "D. 技术革命和社会主义建设"], answer: "D", explanation: "八大提出党和全国人民的主要任务是集中力量发展社会生产力，实现国家工业化，逐步满足人民日益增长的物质和文化需要。选项D（技术革命和社会主义建设）概括了这一重点。" },
                { id: '4-7', type: '单选', question: "毛泽东系统论述社会主义社会矛盾理论的著作是:", options: ["A. 《关于正确处理人民内部矛盾的问题》", "B. 《新民主主义论》", "C. 《论十大关系》", "D. 《中国社会各阶级的分析》"], answer: "A", explanation: "这是系统论述社会主义矛盾理论的著作。" },
                { id: '4-8', type: '单选', question: "毛泽东在《关于正确处理人民内部矛盾的问题》的报告中指出，社会主义社会的基本矛盾是:", options: ["A. 人民内部的非对抗性的矛盾", "B. 生产关系和生产力之间、上层建筑和经济基础之间的矛盾", "C. 无产阶级和资产阶级之间、社会主义和资本主义之间的矛盾", "D. 人民日益增长的物质文化需要同落后的社会生产之间的矛盾"], answer: "B", explanation: "社会主义社会的基本矛盾仍然是生产力与生产关系、经济基础与上层建筑的矛盾。" },
                { id: '4-9', type: '单选', question: "毛泽东认为社会主义社会基本矛盾的特点是:", options: ["A. 相适应", "B. 相矛盾", "C. 又相适应又相矛盾", "D. 不相适应又不相矛盾"], answer: "C", explanation: "社会主义基本矛盾是非对抗性的，具有既相适应又相矛盾的特点。" },
                { id: '4-10', type: '单选', question: "毛泽东认为，解决社会主义基本矛盾的途径和方法是:", options: ["A. 经过革命", "B. 经过社会主义制度本身来解决", "C. 经过发展生产力", "D. 经过改变社会主义制度"], answer: "B", explanation: "可以通过社会主义制度本身的自我调整和完善来解决。" },
                { id: '4-11', type: '单选', question: "下列不属于人民内部矛盾的是:", options: ["A. 工人阶级和农民阶级的矛盾", "B. 工人、农民同知识分子之间的矛盾", "C. 敌对分子、敌对势力与人民的矛盾", "D. 民主同集中的矛盾"], answer: "C", explanation: "敌对分子、敌对势力与人民的矛盾属于敌我矛盾。" },
                { id: '4-12', type: '单选', question: "人民内部矛盾是:", options: ["A. 分清是非的问题", "B. 分清你我的问题", "C. 分清敌我的问题", "D. 分清对错的问题"], answer: "A", explanation: "人民内部矛盾是在人民利益根本一致基础上的矛盾，是分清是非的问题。" },
                { id: '4-13', type: '单选', question: "解决敌我矛盾应采用:", options: ["A. 说服的方法", "B. 专政的方法", "C. 民主的方法", "D. 教育的方法"], answer: "B", explanation: "敌我矛盾是对抗性的，需要用专政的方法解决。" },
                { id: '4-14', type: '单选', question: "毛泽东强调，社会主义国家政治生活的主题是:", options: ["A. 正确区分和处理两类不同性质矛盾的问题", "B. 正确处理人民内部矛盾的问题", "C. 正确处理敌我矛盾的问题", "D. 正确认识和处理阶级斗争的问题"], answer: "B", explanation: "正确处理人民内部矛盾是国家政治生活的主题。" },
                { id: '4-15', type: '单选', question: "关于人民内部矛盾表述正确的是:", options: ["A. 人民内部矛盾是由于人民根本利益不一致导致的", "B. 领导同被领导之间的矛盾属于人民内部矛盾", "C. 工人阶级和民族资产阶级之间的矛盾不属于人民内部矛盾", "D. 人民内部矛盾是固定不变的，不会随条件的变化而发生转化"], answer: "B", explanation: "领导同被领导之间的矛盾属于人民内部矛盾。" },
                { id: '4-16', type: '单选', question: "在人民民主专政体制下，正确处理两类不同性质社会矛盾的基本方法是:", options: ["A. 依法严惩和说服教育", "B. 暴力镇压和说服教育", "C. 批评和团结", "D. 专政和民主"], answer: "D", explanation: "对敌专政，对人民民主。" },
                { id: '4-17', type: '单选', question: "解决科学文化领域的矛盾应坚持的方针是:", options: ["A. 百家争鸣、百花齐放", "B. 团结-批评-团结", "C. 文化交流和艺术实践", "D. 异域文化之间的交流与碰撞"], answer: "A", explanation: "双百方针：百花齐放，百家争鸣。" },
                { id: '4-18', type: '单选', question: "毛泽东明确提出要走一条有别于苏联的中国工业化道路的著述是:", options: ["A. 《论十大关系》", "B. 《关于正确处理人民内部矛盾的问题》", "C. 《为争取国家财政经济状况基本好转而斗争》", "D. 《在扩大的中央工作会议上的讲话》"], answer: "B", explanation: "虽然《论十大关系》开始了探索，但《关于正确处理人民内部矛盾的问题》明确提出了中国工业化道路的概念。" },
                { id: '4-19', type: '单选', question: "促使我党思考和探索如何走中国工业化道路的直接原因是:", options: ["A. 以苏为鉴，吸取苏联在建设社会主义中的教训", "B. 我国重工业、农业和轻工业发展的比例失调", "C. 我国生产力落后，经济基础薄弱", "D. 受苏联的影响，强调重工业的发展。"], answer: "A", explanation: "苏联模式的弊端暴露，促使我们以苏为鉴。" },
                { id: '4-20', type: '单选', question: "走中国工业化道路的关键问题是:", options: ["A. 正确处理重工业和轻工业、农业的关系", "B. 正确处理人民内部的矛盾", "C. 正确处理两类不同性质的矛盾", "D. 调动一切积极因素为社会主义建设服务"], answer: "A", explanation: "农、轻、重关系是中国工业化道路的关键。" },
                { id: '4-21', type: '单选', question: "我国走工业化道路的根本原因是:", options: ["A. 新中国的工业基础十分薄弱", "B. 中国民族工业发展已经具有了深厚的基础", "C. 是中国共产党重视国家工业化的一贯政策", "D. 实现民族独立和国家富强的内在要求和必要条件"], answer: "D", explanation: "实现民族独立和国家富强的必然要求。" },
                { id: '4-22', type: '单选', question: "实现我国工业化应坚持的方针不包括:", options: ["A. “两条腿走路”", "B. 农业为基础，工业为主导，以农轻重为序", "C. 中央工业和地方工业并举", "D. 国家、生产单位和生产者个人利益兼顾"], answer: "D", explanation: "D项属于分配关系，不属于工业化方针本身（如“两条腿走路”等）。" },
                { id: '4-23', type: '单选', question: "提出了“三个主体，三个补充”设想的是:", options: ["A. 毛泽东", "B. 刘少奇", "C. 陈云", "D. 邓小平"], answer: "C", explanation: "陈云在八大提出了“三个主体，三个补充”。" },
                { id: '4-24', type: '单选', question: "我党提出的“三个主体、三个补充”意味着:", options: ["A. 社会主义国家要消除商品经济", "B. 发展商品生产会导致资本主义", "C. 在我国经济建设发展过程中，也要发挥非公有制经济和市场的作用", "D. 商品经济是资本主义的本质特征"], answer: "C", explanation: "这标志着对非公有制经济和市场作用的初步认识。" },
                { id: '4-25', type: '单选', question: "党的八大提出的经济建设的正确方针是:", options: ["A. 统筹兼顾，全面安排", "B. 既反保守又反冒进、在综合平衡中稳步前进", "C. 团结互助，统筹兼顾", "D. 具体问题具体分析"], answer: "B", explanation: "八大坚持了既反保守又反冒进、在综合平衡中稳步前进的方针。" }
            ],
            "第五章: 中国特色社会主义理论体系概论": [
                { id: '5-1', type: '单选', question: "20世纪70年代，整个世界发生着大变动大调整，时代主题是:", options: ["A. 革命与战争", "B. 和平与发展", "C. 合作与共赢", "D. 开放与融通"], answer: "B", explanation: "时代主题由“战争与革命”转变为“和平与发展”。" },
                { id: '5-2', type: '单选', question: "科技进步日新月异，以( )为核心的高新技术的发展，极大地改变了人们的生产、生活方式和国际经济、政治关系。", options: ["A. 经济革命", "B. 信息技术", "C. 全球化", "D. 多极化"], answer: "B", explanation: "信息技术是高新技术的先导和核心。" },

                { id: '5-5', type: '单选', question: "以胡锦涛同志为主要代表的中国共产党人，创造性地回答了( )这一重大问题。", options: ["A. 什么是社会主义，怎样建设社会主义", "B. 建设什么样的党，怎样建设党", "C. 实现什么样的发展，怎样发展", "D. 什么是马克思主义，怎样发展马克思主义"], answer: "C", explanation: "科学发展观回答了实现什么样的发展、怎样发展的问题。" },
                { id: '5-6', type: '单选', question: "我国改革从( )率先突破，逐步转向城市经济体制改革并全面铺开:", options: ["A. 计划经济为主，市场经济为辅", "B. 计划少一点，市场多一点", "C. 包干到户", "D. 农村实行家庭联产承包责任制"], answer: "D", explanation: "改革首先在农村突破，实行家庭联产承包责任制。" },
                { id: '5-7', type: '单选', question: "1978年12月召开的党的十一届三中全会，重新确立了( )的思想路线:", options: ["A. 实事求是", "B. 群众路线", "C. 独立自主", "D. 解放思想"], answer: "A", explanation: "十一届三中全会重新确立了实事求是的思想路线。" },
                { id: '5-8', type: '单选', question: "1982年邓小平在党的十二大开幕词中明确提出:走自己的道路，( )。", options: ["A. 建设社会主义市场经济", "B. 建设有中国特色的社会主义", "C. 实现马克思主义中国化时代化", "D. 建设社会主义初级阶段"], answer: "B", explanation: "十二大正式提出了“建设有中国特色的社会主义”的命题。" },
                { id: '5-9', type: '单选', question: "1987年召开的党的十三大...明确概括和全面阐发了党的( )的基本路线。", options: ["A. 社会主义全面发展", "B. “三步走”", "C. “一个中心、两个基本点”", "D. “四项基本原则”"], answer: "C", explanation: "十三大概括了“一个中心、两个基本点”的基本路线。" },
                { id: '5-10', type: '单选', question: "南方谈话是( )的集大成之作...邓小平理论也逐步走向成熟。", options: ["A. 毛泽东思想", "B. 邓小平理论", "C. “三个代表”重要思想", "D. 科学发展观"], answer: "B", explanation: "南方谈话标志着邓小平理论的成熟。" },
                { id: '5-11', type: '单选', question: "根本原因是在十四年的伟大实践中，坚持把( )同中国具体实际相结合...", options: ["A. 马克思列宁主义", "B. 毛泽东思想", "C. 马克思主义基本原理", "D. 科学社会主义"], answer: "C", explanation: "坚持把马克思主义基本原理同中国具体实际相结合。" },

                { id: '5-13', type: '单选', question: "( )的宪法修正案正式将邓小平理论载入宪法。", options: ["A. 1998年", "B. 1999年", "C. 2000年", "D. 2001年"], answer: "B", explanation: "1999年宪法修正案将邓小平理论载入宪法。" },

                { id: '5-16', type: '单选', question: "我们党的文件中第一次提出科学发展观是在( )。", options: ["A. 党的十六大", "B. 党的十六届三中全会", "C. 党的十六届四中全会", "D. 党的十七大"], answer: "B", explanation: "十六届三中全会第一次提出科学发展观。" },
                { id: '5-17', type: '单选', question: "党的( )把科学发展观写入党章，科学发展观进一步走向成熟。", options: ["A. 十六大", "B. 十七大", "C. 十八大", "D. 十九大"], answer: "B", explanation: "十七大把科学发展观写入党章。（注：十八大将其确立为指导思想）。" },
                { id: '5-18', type: '单选', question: "2017年，党的( )把习近平新时代中国特色社会主义思想确立为党必须长期坚持的指导思想并庄严地写入党章:", options: ["A. 十七大", "B. 十八大", "C. 十九大", "D. 二十大"], answer: "C", explanation: "十九大确立习思想为指导思想。" },
                { id: '5-19', type: '单选', question: "2018年，( )通过的宪法修正案，郑重地把习近平新时代中国特色社会主义思想载入宪法:", options: ["A. 十三届全国人大一次会议", "B. 十三届全国人大二次会议", "C. 十四届全国人大一次会议", "D. 十四届全国人大二次会议"], answer: "A", explanation: "2018年十三届全国人大一次会议通过宪法修正案。" },
                { id: '5-20', type: '单选', question: "中央召开经济工作会议，强调科学发展观第一要义是( ):", options: ["A. 发展", "B. 开放", "C. 改革", "D. 以人为本"], answer: "A", explanation: "科学发展观第一要义是发展。" }

            "第六章: 邓小平理论": [
                { id: '6-1', type: '单选', question: "1980年5月，( )第一次提出了 “社会主义的本质”这个概念。", options: ["A. 毛泽东", "B. 邓小平", "C. 江泽民", "D. 胡锦涛"], answer: "B", explanation: "邓小平在1980年第一次提出了“社会主义的本质”这一概念。" },
                { id: '6-2', type: '单选', question: "1979年3月，邓小平在党的理论工作务虚会上发表( )的讲话。", options: ["A. 《坚持四项基本原则》", "B. 《解放思想实事求是，团结一致向前看》", "C. 《社会主义本质》", "D. 《社会主义计划经济与市场经济》"], answer: "A", explanation: "1979年理论工作务虚会上，邓小平发表了《坚持四项基本原则》的重要讲话。" },

                { id: '6-5', type: '单选', question: "邓小平理论轮廓的形成标志是:", options: ["A. 党十一届三中全会公报", "B. 党的十三大报告", "C. 党十五大报告", "D. 南方谈话"], answer: "B", explanation: "党的十三大报告系统阐述了社会主义初级阶段理论，标志着邓小平理论轮廓的形成。" },

                    quizMode: state.quizMode,
                    darkMode: state.darkMode,
                    startTime: state.startTime,

                localStorage.setItem('maogai_pro_v2', JSON.stringify(toSave));

            container.appendChild(toast);

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

            if (state.timerInterval) clearInterval(state.timerInterval);
            state.startTime = Date.now() - (state.elapsedTime * 1000);
            state.timerInterval = setInterval(() => {

                const timerEl = document.getElementById('timer');
                if (timerEl) timerEl.textContent = formatTime(state.elapsedTime);

            }

            state.stats.totalAnswered++;
            if (isCorrect) {
                state.stats.totalCorrect++;
                state.stats.streak++;
                if (state.stats.streak > state.stats.maxStreak) {
                    state.stats.maxStreak = state.stats.streak;
                }
            } else {
                state.stats.streak = 0;
            }
            
            const today = new Date().toDateString();
            if (!state.stats.studyDays.includes(today)) {
                state.stats.studyDays.push(today);

            saveToStorage();

                state.selectedChapterName = "综合模拟";

                const allQuestions = Object.values(CHAPTER_DATA).flat();
                state.deck = allQuestions.filter(q => state.favoriteQuestions.includes(q.id));
                state.selectedChapterName = "我的收藏";
            } else if (chapterName === 'wrong') {
                const allQuestions = Object.values(CHAPTER_DATA).flat();
                state.deck = allQuestions.filter(q => state.wrongQuestions.includes(q.id));
                state.selectedChapterName = "错题强化";
            } else {
                state.deck = CHAPTER_DATA[chapterName] || [];
                state.selectedChapterName = chapterName;
            }
            
            state.currentCardIndex = 0;
            state.userAnswers = {};
            state.quizMode = 'normal';
            state.view = 'quiz';
            state.elapsedTime = 0;
            startTimer();
            saveToStorage();
            render();
        }

        function handleOptionClick(option) {
            if (state.userAnswers[state.currentCardIndex]) return;
            
            const currentCard = state.deck[state.currentCardIndex];
            state.userAnswers[state.currentCardIndex] = option;
            
            const isCorrect = option.charAt(0) === currentCard.answer;
            updateStats(isCorrect);
            
            if (!isCorrect && !state.wrongQuestions.includes(currentCard.id)) {
                state.wrongQuestions.push(currentCard.id);
            }
            
            saveToStorage();
            
            // 保存当前滚动位置
            const scrollContainer = document.querySelector('.overflow-y-auto.custom-scrollbar');
            const scrollPos = scrollContainer ? scrollContainer.scrollTop : 0;
            
            renderQuiz();
            
            // 恢复滚动位置
            requestAnimationFrame(() => {
                const newScrollContainer = document.querySelector('.overflow-y-auto.custom-scrollbar');
                if (newScrollContainer) {
                    newScrollContainer.scrollTop = scrollPos;
                }
            });
        }

            if (state.currentCardIndex < state.deck.length - 1) {

                renderQuiz();
            } else {

                state.view = 'result';
                render();
            }
        }

                                        <span class="px-2 py-1 bg-blue-100 dark:bg-blue-900 text-blue-700 dark:text-blue-300 text-xs font-bold rounded-lg">${currentCard.type}</span>
                                        ${currentCard.tags ? currentCard.tags.map(tag => `
                                            <span class="px-2 py-1 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 text-xs rounded-lg">${tag}</span>
                                        `).join('') : ''}
                                    </div>
                                    <h2 class="text-lg font-bold text-slate-900 dark:text-white leading-relaxed">${currentCard.question}</h2>
                                </div>
                                <button onclick="toggleFavorite('${currentCard.id}')" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 shrink-0">
                                    <i data-lucide="star" class="w-5 h-5 ${isFavorite ? 'fill-yellow-400 text-yellow-400' : 'text-slate-400'}"></i>
                                </button>
                            </div>

                            <div class="space-y-3 animate-slideIn" style="animation-delay: 0.1s">
                                ${currentCard.options.map((option, idx) => {
                                    const letter = option.charAt(0);
                                    let statusClass = "bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300";
                                    let iconHtml = `<div class="w-6 h-6 rounded-full border-2 border-slate-300 dark:border-slate-600"></div>`;

                                    if (isAnswered) {
                                        if (letter === currentCard.answer) {
                                            statusClass = "bg-green-50 dark:bg-green-900/20 border-green-500 text-green-700 dark:text-green-400";
                                            iconHtml = `<i data-lucide="check-circle" class="w-6 h-6 text-green-500 fill-current"></i>`;
                                        } else if (selectedOption && letter === selectedOption.charAt(0)) {
                                            statusClass = "bg-red-50 dark:bg-red-900/20 border-red-500 text-red-700 dark:text-red-400 animate-shake";
                                            iconHtml = `<i data-lucide="x-circle" class="w-6 h-6 text-red-500 fill-current"></i>`;
                                        } else {
                                            statusClass = "bg-slate-50 dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-400 opacity-60";
                                        }
                                    }

                                    return `
                                    <button onclick="handleOptionClick('${option.replace(/'/g, "\\'")}')" ${isAnswered ? 'disabled' : ''} 
                                        class="option-btn w-full p-4 rounded-xl text-left font-medium text-sm flex items-center justify-between ${statusClass}">
                                        <span class="leading-snug pr-4">${option}</span>
                                        ${iconHtml}
                                    </button>`;
                                }).join('')}
                            </div>

                            ${isAnswered ? `
                            <div class="mt-6 animate-slideIn" style="animation-delay: 0.2s">
                                <div class="bg-gradient-to-br from-indigo-50 to-purple-50 dark:from-indigo-900/20 dark:to-purple-900/20 rounded-2xl p-5 border border-indigo-100 dark:border-indigo-800">
                                    <div class="flex items-center gap-2 mb-3">
                                        <div class="w-8 h-8 bg-indigo-500 rounded-lg flex items-center justify-center">
                                            <i data-lucide="lightbulb" class="w-4 h-4 text-white"></i>
                                        </div>
                                        <span class="text-sm font-bold text-indigo-900 dark:text-indigo-300">答案解析</span>
                                    </div>
                                    <p class="text-sm text-slate-700 dark:text-slate-300 leading-relaxed">${currentCard.explanation}</p>
                                </div>
                            </div>` : ''}
                        </div>
                    </div>

                    <!-- 底部操作栏 -->
                    <div class="glass border-t border-slate-200 dark:border-slate-700 p-4">
                        <div class="flex gap-3 max-w-2xl mx-auto">
                            <button onclick="prevQuestion()" ${state.currentCardIndex === 0 ? 'disabled' : ''} 
                                class="flex-1 px-4 py-3 rounded-xl font-bold text-sm bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 flex items-center justify-center gap-2 disabled:opacity-30 card-hover">
                                <i data-lucide="chevron-left" class="w-4 h-4"></i> 上一题
                            </button>
                            ${state.currentCardIndex < state.deck.length - 1 ? 
                            `<button onclick="nextQuestion()" ${!isAnswered ? 'disabled' : ''} 
                                class="flex-[2] btn-primary text-white px-4 py-3 rounded-xl font-bold text-sm flex items-center justify-center gap-2 disabled:opacity-30 disabled:shadow-none card-hover">
                                下一题 <i data-lucide="chevron-right" class="w-4 h-4"></i>
                            </button>` :
                            `<button onclick="nextQuestion()" ${!isAnswered ? 'disabled' : ''} 
                                class="flex-[2] bg-gradient-to-r from-green-500 to-emerald-600 text-white px-4 py-3 rounded-xl font-bold text-sm flex items-center justify-center gap-2 disabled:opacity-30 shadow-lg shadow-green-500/30 card-hover">
                                <i data-lucide="check-circle" class="w-4 h-4"></i> 完成
                            </button>`
                            }
                        </div>
                    </div>
                </div>
            `;
            
            lucide.createIcons();
            if (state.timerInterval) startTimer();
        }

        function renderResult() {
            const total = Object.keys(state.userAnswers).length;
            const correct = Object.keys(state.userAnswers).filter(idx => {
                const card = state.deck[idx];
                return state.userAnswers[idx].charAt(0) === card.answer;
            }).length;
            const accuracy = total > 0 ? Math.round((correct / total) * 100) : 0;
            const timeSpent = formatTime(state.elapsedTime);
            
            let message = '';
            let emoji = '';
            if (accuracy === 100) {
                message = '完美！全部正确！';
                emoji = '🎉';
            } else if (accuracy >= 90) {
                message = '太棒了！继续保持！';
                emoji = '🌟';
            } else if (accuracy >= 80) {
                message = '很不错！再接再厉！';
                emoji = '👍';
            } else if (accuracy >= 60) {
                message = '还不错，继续努力！';
                emoji = '💪';
            } else {
                message = '加油！多练习会更好！';
                emoji = '📚';
            }

            app.innerHTML = `
                <div class="w-full h-full flex flex-col items-center justify-center p-8 text-center bg-gradient-to-br from-slate-50 to-blue-50 dark:from-slate-900 dark:to-slate-800">
                    <div class="animate-scaleIn">
                        <div class="text-6xl mb-6 animate-bounce-slow">${emoji}</div>
                        
                        <div class="relative mb-8">
                            <svg class="w-48 h-48 transform -rotate-90">
                                <circle cx="96" cy="96" r="88" stroke="#E2E8F0" stroke-width="12" fill="none" class="dark:stroke-slate-700" />
                                <circle cx="96" cy="96" r="88" stroke="${accuracy >= 60 ? '#22C55E' : '#EF4444'}" stroke-width="12" fill="none" 
                                    stroke-dasharray="552.9" stroke-dashoffset="${552.9 - (552.9 * accuracy / 100)}" 
                                    stroke-linecap="round" class="progress-ring" />
                            </svg>
                            <div class="absolute inset-0 flex flex-col items-center justify-center">
                                <span class="text-5xl font-extrabold gradient-text">${accuracy}%</span>
                                <span class="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mt-2">正确率</span>
                            </div>
                        </div>
                        
                        <h2 class="text-2xl font-bold mb-2 text-slate-900 dark:text-white">${message}</h2>
                        <p class="text-slate-600 dark:text-slate-400 mb-8 text-sm">
                            本次练习共 ${state.deck.length} 题 · 答对 ${correct} 题 · 用时 ${timeSpent}
                        </p>

                        <div class="grid grid-cols-3 gap-4 mb-8 max-w-md mx-auto">
                            <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700">
                                <div class="text-3xl font-bold text-green-600">${correct}</div>
                                <div class="text-xs text-slate-500 dark:text-slate-400 mt-1">答对</div>
                            </div>
                            <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700">
                                <div class="text-3xl font-bold text-red-600">${total - correct}</div>
                                <div class="text-xs text-slate-500 dark:text-slate-400 mt-1">答错</div>
                            </div>
                            <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700">
                                <div class="text-3xl font-bold text-blue-600">${state.stats.maxStreak}</div>
                                <div class="text-xs text-slate-500 dark:text-slate-400 mt-1">最高连对</div>
                            </div>
                        </div>

                        <div class="space-y-3 max-w-md mx-auto">
                            ${state.wrongQuestions.length > 0 ? `
                            <button onclick="startQuiz('wrong')" class="w-full bg-gradient-to-r from-red-500 to-rose-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-red-500/30 flex items-center justify-center gap-2 card-hover">
                                <i data-lucide="refresh-cw" class="w-5 h-5"></i> 复习错题 (${state.wrongQuestions.length})
                            </button>` : ''}
                            
                            <button onclick="startQuiz(state.selectedChapterName === '综合模拟' ? 'all' : state.selectedChapterName)" 
                                class="w-full bg-gradient-to-r from-blue-500 to-purple-600 text-white py-4 rounded-2xl font-bold shadow-lg shadow-blue-500/30 flex items-center justify-center gap-2 card-hover">
                                <i data-lucide="rotate-ccw" class="w-5 h-5"></i> 再来一次
                            </button>
                            
                            <button onclick="state.view='dashboard'; render()" 
                                class="w-full bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 py-4 rounded-2xl font-bold border border-slate-200 dark:border-slate-700 flex items-center justify-center gap-2 card-hover">
                                <i data-lucide="home" class="w-5 h-5"></i> 返回主页
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderStats() {
            const totalQuestions = Object.values(CHAPTER_DATA).reduce((acc, curr) => acc + curr.length, 0);
            const accuracy = state.stats.totalAnswered > 0 ? 
                Math.round((state.stats.totalCorrect / state.stats.totalAnswered) * 100) : 0;
            const studyDays = state.stats.studyDays.length;

            app.innerHTML = `
                <div class="w-full h-full overflow-y-auto custom-scrollbar">
                    <!-- 顶部栏 -->
                    <div class="glass border-b border-slate-200 dark:border-slate-700 px-6 py-4 flex items-center justify-between">
                        <button onclick="state.view='dashboard'; render()" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">
                            <i data-lucide="arrow-left" class="w-5 h-5 text-slate-600 dark:text-slate-300"></i>
                        </button>
                        <h1 class="text-lg font-bold text-slate-900 dark:text-white">学习统计</h1>
                        <button onclick="resetProgress()" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 text-red-500">
                            <i data-lucide="trash-2" class="w-5 h-5"></i>
                        </button>
                    </div>

                    <div class="p-6 space-y-6 pb-20">
                        <!-- 总体统计 -->
                        <div class="bg-gradient-to-br from-purple-500 to-pink-600 rounded-3xl p-6 text-white shadow-xl animate-scaleIn">
                            <h2 class="text-sm opacity-90 mb-4 uppercase tracking-wider">总体数据</h2>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <div class="text-4xl font-bold mb-1">${state.stats.totalAnswered}</div>
                                    <div class="text-xs opacity-75">累计答题</div>
                                </div>
                                <div>
                                    <div class="text-4xl font-bold mb-1">${accuracy}%</div>
                                    <div class="text-xs opacity-75">总正确率</div>
                                </div>
                                <div>
                                    <div class="text-4xl font-bold mb-1">${studyDays}</div>
                                    <div class="text-xs opacity-75">学习天数</div>
                                </div>
                                <div>
                                    <div class="text-4xl font-bold mb-1">${state.stats.maxStreak}</div>
                                    <div class="text-xs opacity-75">最高连对</div>
                                </div>
                            </div>
                        </div>

                        <!-- 学习进度 -->
                        <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 border border-slate-200 dark:border-slate-700 animate-slideIn">
                            <h2 class="text-lg font-bold text-slate-900 dark:text-white mb-4">学习进度</h2>
                            <div class="space-y-4">
                                <div>
                                    <div class="flex justify-between text-sm mb-2">
                                        <span class="text-slate-600 dark:text-slate-400">题库完成度</span>
                                        <span class="font-bold text-slate-900 dark:text-white">${Math.round((state.stats.totalAnswered / totalQuestions) * 100)}%</span>
                                    </div>
                                    <div class="h-3 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
                                        <div class="h-full bg-gradient-to-r from-blue-500 to-purple-600 rounded-full transition-all duration-500" 
                                            style="width: ${Math.min((state.stats.totalAnswered / totalQuestions) * 100, 100)}%"></div>
                                    </div>
                                </div>
                                
                                <div class="grid grid-cols-3 gap-3 pt-4 border-t border-slate-100 dark:border-slate-700">
                                    <div class="text-center">
                                        <div class="text-2xl font-bold text-slate-900 dark:text-white">${totalQuestions}</div>
                                        <div class="text-xs text-slate-500 dark:text-slate-400 mt-1">总题数</div>
                                    </div>
                                    <div class="text-center">
                                        <div class="text-2xl font-bold text-green-600">${state.stats.totalCorrect}</div>
                                        <div class="text-xs text-slate-500 dark:text-slate-400 mt-1">答对</div>
                                    </div>
                                    <div class="text-center">
                                        <div class="text-2xl font-bold text-red-600">${state.wrongQuestions.length}</div>
                                        <div class="text-xs text-slate-500 dark:text-slate-400 mt-1">错题</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 章节统计 -->
                        <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 border border-slate-200 dark:border-slate-700 animate-slideIn" style="animation-delay: 0.1s">
                            <h2 class="text-lg font-bold text-slate-900 dark:text-white mb-4">章节统计</h2>
                            <div class="space-y-3">
                                ${Object.keys(CHAPTER_DATA).map(chapter => {
                                    const chapterQuestions = CHAPTER_DATA[chapter];
                                    const chapterWrong = chapterQuestions.filter(q => state.wrongQuestions.includes(q.id)).length;
                                    const chapterFavorite = chapterQuestions.filter(q => state.favoriteQuestions.includes(q.id)).length;
                                    
                                    return `
                                    <div class="flex items-center justify-between p-3 bg-slate-50 dark:bg-slate-900 rounded-xl">
                                        <div class="flex-1">
                                            <div class="font-bold text-sm text-slate-900 dark:text-white mb-1">${chapter}</div>
                                            <div class="flex items-center gap-3 text-xs text-slate-500 dark:text-slate-400">
                                                <span>共${chapterQuestions.length}题</span>
                                                ${chapterWrong > 0 ? `<span class="text-red-500">错${chapterWrong}</span>` : ''}
                                                ${chapterFavorite > 0 ? `<span class="text-yellow-500">藏${chapterFavorite}</span>` : ''}
                                            </div>
                                        </div>
                                        <button onclick="startQuiz('${chapter}')" class="px-3 py-1.5 bg-blue-500 text-white text-xs font-bold rounded-lg hover:bg-blue-600">
                                            练习
                                        </button>
                                    </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                        <!-- 学习建议 -->
                        <div class="bg-gradient-to-br from-amber-50 to-orange-50 dark:from-amber-900/20 dark:to-orange-900/20 rounded-3xl p-6 border border-amber-200 dark:border-amber-800 animate-slideIn" style="animation-delay: 0.2s">
                            <div class="flex items-center gap-2 mb-3">
                                <i data-lucide="lightbulb" class="w-5 h-5 text-amber-600"></i>
                                <h2 class="text-lg font-bold text-slate-900 dark:text-white">学习建议</h2>
                            </div>
                            <ul class="space-y-2 text-sm text-slate-700 dark:text-slate-300">
                                ${state.wrongQuestions.length > 10 ? 
                                    '<li>• 错题较多，建议重点复习错题集</li>' : 
                                    '<li>• 错题控制得不错，继续保持！</li>'}
                                ${accuracy < 80 ? 
                                    '<li>• 正确率还有提升空间，多做练习</li>' : 
                                    '<li>• 正确率很高，可以尝试综合模拟</li>'}
                                ${studyDays < 7 ? 
                                    '<li>• 坚持每天学习，养成良好习惯</li>' : 
                                    '<li>• 学习习惯很好，继续坚持！</li>'}
                                <li>• 建议使用收藏功能标记重点题目</li>
                            </ul>
                        </div>
                    </div>
                </div>
            `;
        }

        // ========== 初始化 ==========
        function init() {
            loadFromStorage();
            render();
        }

        // 启动应用
        init();
    </script>
</body>
</html>
